# main 브랜치에 push하면 포트폴리오를 다시 빌드해서 GitHub Pages에 배포합니다.
# 최초 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정
name: Deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pyyaml jinja2
      - run: python scripts/build.py
      - run: npm install playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/pdf.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
