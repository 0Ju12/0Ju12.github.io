data:
  label: "데이터 엔지니어·분석가"
  headline: "공개 데이터 수집·정제부터 웨어하우스 모델링과 분석까지 하는 데이터 엔지니어·분석가"
  highlights:
    - { value: "분석 웨어하우스", label: "전력 수요·채용 공고 질문 8개 · dbt 테스트 129개" }
    - { value: "API 관제", label: "공개 API 22개 · 정기 점검 · 품질 판정" }
    - { value: "SCIE 1편", label: "SPE Journal 제1저자 · 분석 코드 공개" }
    - { value: "SSAFY 16기", label: "삼성 청년 SW·AI 아카데미" }
  order: [personal, bootcamp, grad, undergrad]
  titles:
    personal: "개인 프로젝트 — 공개 데이터 분석 웨어하우스(dbt) · 전력 수요 예측"
  brief:
    personal:
      - "분석 웨어하우스(개인): 전력 수요·기온과 데이터 직무 채용 공고로 질문 8개를 세우고 dbt 분석 표로 답함: 평일 기온 두 구간 모형(17.5℃ 위 1℃당 +1,636 MW, R² 0.83), 일사량 100 W/m²당 한낮 수요 −2,704 MW(저녁 대조군 차이 없음), 쉬는 날·연휴 비교, 직무별 기술 언급률 · 원본→정제→집계→분석 4단, dbt 테스트 129개, 매일 GitHub Actions 실행"
      - "전력 수요 하루 전 예측: 지난주 같은 시각 기준선 MAPE 6.17% → 3.23% (시간 순서 분할·누수 검사)"
    bootcamp:
      - "국보 입문 가이드(개인): 국가유산청 오픈API(XML·EUC-KR)·위키백과 수집 → 정제 → ChromaDB 색인. 청크 ID 고정으로 재실행해도 중복 없는 색인, 질문별 수집 캐시·위키 장애 시 저장본 대체, 429/5xx Retry-After 재시도"
    grad:
      - "항공 중력·자력 격자 자료를 파수 영역에서 처리하는 분석 파이프라인을 만들고, 겹친 신호를 분리하는 지표(SLFI·DLFI)를 설계해 독립 모델 3개와 상관계수 0.94 이상 일치"
      - "분석 코드를 Python 패키지·테스트로 정리해 공개 · 캘거리대 6개월 파견, 3개 기관 공동연구 → SCIE SPE Journal 제1저자 (2026)"
    undergrad:
      - "IAB 융합전공 캡스톤: ArcGIS로 산불 래스터 데이터를 구축하고 U-LSTM으로 화선 예측, 미학습 산불 테스트 Accuracy 0.90 · F1 0.85"
      - "제1저자 논문: GPlates 판구조 복원 + 대규모 CO2 저장소 탄성파 해석 (지구물리와 물리탐사, 2024) · 제2저자 논문 1편 · 학회 발표 3건"
  skills:
    - { category: "수집·처리", items: [Python, Pandas, SQL, "오픈API(XML·JSON)", 웹 수집] }
    - { category: "모델링·저장", items: ["dbt(DuckDB)", 차원 모델링, "변경 이력(SCD 2형)", ChromaDB, Django ORM] }
    - { category: "품질·운영", items: [데이터 품질 테스트, pytest, GitHub Actions, "Airflow DAG 작성"] }
    - { category: "분석·ML·공간", items: [PyTorch, Hugging Face, LangGraph RAG, ArcGIS] }

ai:
  label: "AI·ML 엔지니어"
  headline: "LLM 파인튜닝·RAG·시공간 딥러닝을 실험으로 검증하는 AI·ML 엔지니어"
  highlights:
    - { value: "0.96961", label: "SSAFY AI 챌린지(VQA) Public Score" }
    - { value: "F1 0.32→0.74", label: "FLAN-T5 LoRA 학습 전략 비교" }
    - { value: "SCIE 1편", label: "SPE Journal 제1저자" }
    - { value: "SSAFY 16기", label: "삼성 청년 SW·AI 아카데미" }
  order: [bootcamp, undergrad, grad]
  brief:
    bootcamp:
      - "한끼 에이전트(개인): 냉장고 재고 기반 식단·운동 코치. LangGraph 분석→계획→실행→판정⟲재계획(최대 3회)→응답, 모델은 해석·보조 도구 선택·문장만 맡고 재고·분량 판정은 코드 · 로깅 에이전트로 중복·계획 밖 호출 판정 · Chroma RAG · 자동 테스트 110개"
      - "AI 챌린지(VQA): Qwen 4B 0.94608 → 27B 0.95591 → 확률 앙상블 → Qwen QLoRA·Gemma·OCR·멀티뷰 결합으로 Public 0.96961. 후보는 정확도가 아닌 fixes−breaks와 유형별 회귀로 채택"
      - "국보 입문 가이드(개인): LangGraph retrieve→generate RAG, 출처별 청킹·MMR 검색, 답변의 [근거 N]을 코드로 검증해 없는 번호 제거 · 가짜 LLM 기반 테스트 55개"
      - "POSPEAK(KILL KONG): 콩글리시 교정 데이터셋 구축, FLAN-T5 LoRA 학습 전략 비교(F1 0.32→0.74)·catastrophic forgetting 분석 + RAG · 장려상"
    undergrad:
      - "IAB 융합전공 캡스톤: Conv2D 인코더–LSTM–디코더 U-LSTM을 설계·학습해 산불 4건의 소규모 데이터로 화선 예측, 미학습 산불 테스트 Accuracy 0.90 · F1 0.85"
      - "제1저자 논문: GPlates 판구조 복원 + 대규모 CO2 저장소 탄성파 해석 (지구물리와 물리탐사, 2024) · 학회 발표 3건"
    grad:
      - "파수 영역 상관 분석으로 겹친 중력·자력 신호를 분리하는 지표(SLFI·DLFI)를 설계해 독립 모델 3개와 상관계수 0.94 이상 일치 · 분석 코드 공개"
      - "캘거리대 6개월 파견 · 칼리파대(UAE) 3개 기관 공동연구 → SCIE SPE Journal 제1저자 논문 (2026)"
  skills:
    - { category: "모델·학습", items: [PyTorch, TensorFlow, Hugging Face Transformers, LoRA/QLoRA, "FLAN-T5·Qwen·Gemma"] }
    - { category: "LLM 응용", items: ["LLM 에이전트(LangGraph Planner·Worker)", "RAG(LangGraph·ChromaDB·FAISS)", 프롬프트 설계, 응답·인용 검증] }
    - { category: "딥러닝", items: ["시공간 딥러닝(U-LSTM)", CNN·LSTM, 멀티모델 확률 앙상블, "ArcGIS 래스터 구축"] }
    - { category: "평가·데이터", items: [F1·BERTScore, fixes−breaks 회귀 분석, pytest, Pandas, SQL] }
