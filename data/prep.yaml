opic:
  tip: "OPIc은 약 40분 동안 15문항 안팎을 녹음으로 답합니다. 문항 수·시간·난이도 선택 방식은 공식 안내에서 확인하세요. IH는 '문단 단위로 길게, 시제와 연결어를 정확히' 말하는 것이 핵심입니다."
  types:
    - { id: intro, name: "자기소개", sec: 90 }
    - { id: describe, name: "묘사", sec: 120 }
    - { id: routine, name: "루틴 · 습관", sec: 120 }
    - { id: past, name: "과거 경험", sec: 120 }
    - { id: compare, name: "비교 · 변화", sec: 120 }
    - { id: roleplay, name: "롤플레이", sec: 120 }
    - { id: issue, name: "돌발 · 사회 이슈", sec: 120 }
  frames:
    intro: "Hi, I'm ___. I recently finished my master's in ___ and now I'm in a software academy. → What I do on a normal day → What I enjoy (one hobby that matches my survey) → Where I want to be next year."
    describe: "Big picture (where / what it looks like) → 3 details (place · people · feeling) → Why I like it → Wrap-up: 'So that's ___ in a nutshell.'"
    routine: "Usually / First, I ___ → Then / After that ___ → On weekends it's different: ___ → Why this routine works for me."
    past: "When: 'About two years ago…' → Setting → What happened (past tense, 2~3 events) → Problem or surprise → How it ended + what I learned."
    compare: "Back then: ___ → These days: ___ → The biggest difference is ___ because ___ → My opinion of the change."
    roleplay: "Greeting + situation → 3~4 questions (When / How much / Is it possible to…) → Thank you. / For problem-solving: explain the problem → 2 alternatives → ask for their choice."
    issue: "Name the issue → Two sides or causes → A short example I know → My view and one suggestion."
  questions:
    - { t: intro, q: "Let's start the interview. Tell me a little about yourself." }
    - { t: describe, q: "You indicated that you live in an apartment. Describe your home. What does it look like and which room do you like the most?" }
    - { t: describe, q: "Describe the neighborhood you live in. What are the people and places like?" }
    - { t: describe, q: "You said you like going to the park. Describe a park you often go to." }
    - { t: describe, q: "Describe a café or coffee shop you like. What does it look like and why do you go there?" }
    - { t: describe, q: "You mentioned you listen to music. What kind of music do you like, and who are your favorite artists?" }
    - { t: describe, q: "Describe the city or region where you studied for your degree." }
    - { t: routine, q: "What do you usually do on a typical weekday? Walk me through your day from morning to night." }
    - { t: routine, q: "How do you usually listen to music? When and where do you listen, and with what device?" }
    - { t: routine, q: "What do you usually do when you go to the park? Tell me about your routine there." }
    - { t: routine, q: "How do you prepare when you travel abroad? Tell me the steps from planning to packing." }
    - { t: routine, q: "What do you usually do to stay healthy? Describe your exercise routine." }
    - { t: past, q: "Tell me about a memorable trip you took. Where did you go, who were you with, and what happened?" }
    - { t: past, q: "Tell me about the first time you lived abroad. How did you feel and what was difficult?" }
    - { t: past, q: "Tell me about a time something unexpected happened while you were traveling. How did you deal with it?" }
    - { t: past, q: "Describe a time when you had a problem with a piece of technology. What happened and how did you solve it?" }
    - { t: past, q: "Tell me about a memorable concert or performance you went to." }
    - { t: compare, q: "How has your neighborhood changed over the years? Compare how it was before and how it is now." }
    - { t: compare, q: "How has the way people listen to music changed compared to when you were younger?" }
    - { t: compare, q: "Compare the technology people used ten years ago with what they use today. What changed the most?" }
    - { t: roleplay, q: "I'd like to give you a situation. You want to join a gym near your home. Call the gym and ask three or four questions about membership." }
    - { t: roleplay, q: "You booked a hotel room, but when you arrive the room is not what you reserved. Explain the problem to the front desk and suggest two or three alternatives." }
    - { t: roleplay, q: "I'm planning to visit Korea. Ask me three or four questions about my trip." }
    - { t: roleplay, q: "You bought concert tickets, but you can't go because of an emergency. Call your friend, explain the situation, and suggest some options." }
    - { t: issue, q: "Many companies now use AI in their services. What are the good and bad points of this, in your opinion?" }
    - { t: issue, q: "Tell me about an environmental problem in your country. What causes it and what can people do?" }
    - { t: issue, q: "People spend a lot of time on smartphones these days. What concerns do people have about this?" }
    - { t: issue, q: "Tell me about a recent news story about energy or climate that interested you." }

