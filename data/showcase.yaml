# 각 줄: project(있으면 상세 페이지로 연결) 또는 url. *_en 은 영문 페이지용.
themes:
  - id: platform
    color: "#5b6cff"
    image_from: data-projects
    eyebrow: "개인 프로젝트 · 2026.11 – 진행 중"
    eyebrow_en: "Personal · Nov 2026 – present"
    tab: "공개 데이터 플랫폼"
    tab_en: "Public data platform"
    title: "공개 데이터 플랫폼"
    title_en: "Public data platform"
    lead: "공개 데이터를 일 단위 배치로 수집·정제하고, dbt 웨어하우스에서 모델링·분석하며, 산출물의 신선도(freshness)까지 모니터링합니다. 단일 저장소(모노레포)의 모든 프로젝트에 시계열 분할 검증·자동 테스트(CI)·일일 배포라는 공통 원칙을 적용했습니다."
    lead_en: "Daily batch ingestion and cleansing of public data, modelling and analysis in a dbt warehouse, and freshness monitoring of every output. All projects in the monorepo follow the same standards: time-based validation splits, automated tests (CI) and daily deployment."
    metrics:
      - { v: "0.99 → 0.81", tone: fix, label: "누수 제거", label_en: "Leakage removed", k: "무작위 분할 → 시계열 CV 5겹 정확도(RF). 0.18p는 데이터 누수로 부풀려진 몫, LDA는 0.99 유지", k_en: "Random split → 5-fold time-series CV accuracy (RF). The 0.18 gap was inflated by data leakage; LDA holds 0.99" }
      - { v: "MAPE 3.23%", k: "전력 수요 D-1 예측, 롤링 CV로 모델 선택 (베이스라인 6.17% · 기온 예보 없이 3.44%)", k_en: "Day-ahead load forecast, model chosen by rolling CV (baseline 6.17% · 3.44% without a temperature forecast)" }
      - { v: "R² 0.83", k: "평일 수요–기온 구간 선형 회귀", k_en: "Weekday load vs. temperature, piecewise regression" }
    rows:
      - name: "분석 웨어하우스 (dbt · Airflow)"
        name_en: "Analytics warehouse (dbt · Airflow)"
        text: "전력 수요·기상·채용 공고 데이터로 분석 과제 8개를 정의하고 dbt 마트 모델로 답합니다. 냉방 민감도 1,636 MW/℃, 데이터 품질 테스트 129개."
        text_en: "Eight analytical questions on power load, weather and job postings, each answered by a dbt mart model. Cooling sensitivity 1,636 MW/°C; 129 data-quality tests."
        url: "https://0ju12.github.io/data-projects/warehouse/"
      - name: "전력 수요 예측 · 설비 이상 탐지"
        name_en: "Load forecasting · equipment anomaly detection"
        text: "시계열 분할 검증과 데이터 누수(leakage) 테스트로 성능을 평가합니다. 무작위 분할에서 0.99였던 정확도가 시계열 교차검증에서는 0.81로 내려가, 그 차이만큼이 데이터 누수였음을 확인했습니다."
        text_en: "Evaluated with time-based splits and data-leakage tests. Accuracy of 0.99 under a random split fell to 0.81 under time-series cross-validation, exposing the gap as data leakage."
        url: "https://0ju12.github.io/data-projects/power/"
      - name: "공간 데이터 지도 (지진 · 산불 · 응급실)"
        name_en: "Spatial data maps (earthquakes · wildfire · ER access)"
        text: "지진·산불 위험 레이어는 일 단위로 갱신하고, 1 km 격자별 응급실 접근 시간을 도로 네트워크 분석으로 산출했습니다. 세 레이어를 단일 벡터 타일 파일로 서빙합니다."
        text_en: "Earthquake and wildfire-risk layers refresh daily; ER drive time is computed per 1 km grid cell with road-network analysis. All three layers are served from a single vector-tile file."
        url: "https://0ju12.github.io/data-projects/tiles/"
      - name: "데이터 옵저버빌리티 (API Watch · 파이프라인 상태판)"
        name_en: "Data observability (API Watch · pipeline status)"
        text: "공개 API 22개의 가용성·스키마 변경을 주기적으로 모니터링하고, 워크플로는 성공했지만 내부 단계가 실패한 경우(silent failure)와 갱신 기한을 넘긴 산출물을 탐지해 알림 이슈를 생성합니다."
        text_en: "Monitors availability and schema drift of 22 public APIs on a schedule, and raises alert issues for silent failures inside green workflow runs and for outputs past their freshness deadline."
        url: "https://0ju12.github.io/data-projects/status/"
    links:
      - { label: "아키텍처·검증 상세", label_en: "Architecture & validation", project: data-projects }
      - { label: "GitHub 저장소", label_en: "GitHub", url: "https://github.com/0Ju12/data-projects" }

  - id: llm
    color: "#16a34a"
    image_from: hankki
    eyebrow: "SSAFY 16기 · 개인 프로젝트 · 2026.10 – 진행 중"
    eyebrow_en: "SSAFY 16th · personal · Oct 2026 – present"
    tab: "LLM 에이전트 · RAG"
    tab_en: "LLM agents · RAG"
    title: "결정론적 검증 계층을 갖춘 LLM 서비스"
    title_en: "LLM services with a deterministic validation layer"
    lead: "LLM은 자연어 이해와 응답 생성만 담당하고, 수치 계산과 근거 검증은 규칙 기반 코드가 수행합니다. 환각 인용(hallucinated citation)이나 모델 호출 실패가 발생해도 폴백(fallback) 경로로 서비스가 계속 동작하도록 설계했습니다."
    lead_en: "The LLM handles only language understanding and response generation; arithmetic and evidence checks run in rule-based code. Hallucinated citations or failed model calls fall back to a deterministic path, so the service keeps running."
    metrics:
      - { v: "테스트 110개", v_en: "110 tests", k: "한끼 에이전트 자동화 테스트", k_en: "Automated tests, Hankki agent" }
      - { v: "테스트 55개", v_en: "55 tests", k: "국보 RAG 가이드 E2E 테스트 (Mock LLM)", k_en: "Heritage RAG guide, end-to-end with a mock LLM" }
    rows:
      - project: hankki
        name: "한끼 — 냉장고 재고 기반 식단·운동 코치 에이전트"
        name_en: "Hankki — fridge-aware meal & exercise coach agent"
        text: "LangGraph로 분석 → 계획 → 실행 → 평가 → 재계획(최대 3회) 루프를 구성하고, 재고·분량 검증은 코드로 수행합니다. 요청 ID 기반 멱등성(idempotency)으로 재시도 시 중복 기록을 방지합니다."
        text_en: "A LangGraph loop of analyse → plan → act → evaluate → replan (up to 3 times); stock and portion checks run in code. Request-ID idempotency prevents duplicate records on retry."
      - project: heritage
        name: "국보 RAG 가이드 — 인용 검증 RAG"
        name_en: "Heritage RAG guide — citation-verified RAG"
        text: "국가유산청 오픈API와 위키백과를 색인하고, 생성 답변의 [근거 N] 인용을 후처리 단계에서 검증해 실제 검색 결과와 일치하는 출처만 노출합니다."
        text_en: "Indexes the national heritage API and Wikipedia, then verifies every [source N] citation in post-processing and shows only sources that match the retrieved documents."
    links:
      - { label: "인용 검증 데모", label_en: "Citation-check demo", url: "demo.html", url_en: "demo-en.html" }
      - { label: "한끼 GitHub", label_en: "Hankki on GitHub", url: "https://github.com/0Ju12/ai-agents" }

  - id: research
    color: "#ea7a0c"
    image_from: masters
    eyebrow: "석사 연구 · 2024.03 – 2026.08"
    eyebrow_en: "Graduate research · Mar 2024 – Aug 2026"
    tab: "석사 연구"
    tab_en: "Graduate research"
    title: "파수 영역 상관 분석으로 중첩된 중력·자력 이상 분리"
    title_en: "Separating superimposed gravity and magnetic anomalies in the wavenumber domain"
    lead: "파수 영역 상관 분석을 기반으로 기반암(SLFI)·암염(DLFI) 지시자를 설계했습니다. 캐나다 캘거리대 6개월 파견 기간에 3개 기관과 공동연구를 수행했고, 분석 코드는 테스트를 갖춘 Python 패키지로 공개했습니다."
    lead_en: "Designed basement (SLFI) and salt (DLFI) indicators based on wavenumber-domain correlation, during a six-month research stay at the University of Calgary with three partner institutions. The analysis code is published as a tested Python package."
    metrics:
      - { v: "SCIE 제1저자", v_en: "SCIE first author", k: "SPE Journal (2026)", k_en: "SPE Journal (2026)" }
      - { v: "r ≥ 0.94", k: "독립 모델 3종과의 상관계수", k_en: "Correlation with three independent models" }
      - { v: "약 3 km", v_en: "~3 km", k: "기존 해석 대비 암염 심도 보정", k_en: "Salt-depth correction vs. prior interpretation" }
    rows:
      - project: masters
        name: "석사 학위논문 · SPE Journal 논문"
        name_en: "Master's thesis · SPE Journal paper"
        text: "8~10 km 퇴적층 하부의 중첩 신호를 분리해, 기존 약 6,000 m로 해석되던 암염 심도를 약 9,300 m로 재추정했습니다."
        text_en: "Separated superimposed signals beneath 8–10 km of sediment and re-estimated the salt depth at about 9,300 m, versus about 6,000 m previously."
      - project: calgary-2024
        name: "캐나다 캘거리대 장기 파견 연구"
        name_en: "Long-term research stay, University of Calgary"
        text: "중력·자력 자료 복합 해석(joint interpretation)으로 아부다비 가샤 지역의 암염돔과 기반암 구조를 규명했습니다."
        text_en: "Joint interpretation of gravity and magnetic data to characterise the salt domes and basement of the Ghasha area, Abu Dhabi."
    links:
      - { label: "SPE Journal 논문", label_en: "SPE Journal paper", url: "https://doi.org/10.2118/236968-PA" }
      - { label: "분석 코드 (gravmag-wcf)", label_en: "Code (gravmag-wcf)", url: "https://github.com/0Ju12/gravmag-wcf" }

  - id: experiments
    color: "#db2777"
    image_from: wildfire-capstone
    eyebrow: "팀 프로젝트 · 2023 – 2026"
    eyebrow_en: "Team projects · 2023 – 2026"
    tab: "모델링 실험"
    tab_en: "ML experiments"
    title: "평가 프로토콜을 먼저 설계한 모델링 실험"
    title_en: "ML experiments built on an evaluation protocol first"
    lead: "단일 지표 상승보다 샘플 단위 오류 분석(fixes−breaks)과 유형별 성능 회귀 여부를 먼저 확인했습니다. 시공간 딥러닝, LLM 파인튜닝, 멀티모델 앙상블에 동일한 모델 선택 기준을 적용했습니다."
    lead_en: "Before trusting a higher aggregate score, I ran per-sample error analysis (fixes − breaks) and checked for per-category regressions — the same model-selection rule across spatio-temporal deep learning, LLM fine-tuning and multi-model ensembles."
    metrics:
      - { v: "0.96961", k: "SSAFY AI 챌린지(VQA) Public 리더보드", k_en: "SSAFY AI challenge (VQA), public leaderboard" }
      - { v: "0.32 → 0.74", k: "BERTScore F1 · 포스코 장려상", k_en: "BERTScore F1 · POSCO award" }
      - { v: "F1 0.85", k: "홀드아웃 테스트셋 (미학습 강릉 산불)", k_en: "Held-out test event (Gangneung wildfire)" }
    rows:
      - project: vqa
        name: "VQA 챌린지 — 멀티모델 확률 앙상블"
        name_en: "VQA challenge — multi-model probability ensemble"
        text: "Qwen QLoRA·Gemma·OCR·멀티뷰 모델을 확률 기반 소프트 보팅 앙상블로 결합하고, 신규 후보는 fixes−breaks와 문항 유형별 회귀 검증을 통과한 경우에만 채택했습니다."
        text_en: "Combined Qwen QLoRA, Gemma, OCR and multi-view models with probability-based soft voting; a new candidate was adopted only after passing fixes − breaks and per-category regression checks."
      - project: posco-pospeak
        name: "POSPEAK — 콩글리시를 원어민 표현으로 바꾸는 생성 모델"
        name_en: "POSPEAK — rewriting Konglish into natural English"
        text: "교정용 병렬 데이터셋을 구축하고 FLAN-T5 LoRA 파인튜닝 전략을 비교했습니다. 순차 학습에서 발생한 파국적 망각(catastrophic forgetting)의 원인도 분석했습니다."
        text_en: "Built a parallel correction dataset and compared FLAN-T5 LoRA fine-tuning strategies, including an analysis of catastrophic forgetting under sequential training."
      - project: wildfire-capstone
        name: "U-LSTM 산불 확산 경로 예측 (캡스톤)"
        name_en: "U-LSTM wildfire spread prediction (capstone)"
        text: "ArcGIS로 산불 4건의 화선·기상·지형 래스터 시계열을 구축하고, 다음 시점 화선을 예측하는 U-LSTM(Conv 인코더–LSTM–디코더)을 설계·학습했습니다. 1건은 학습·검증에서 제외한 홀드아웃 테스트셋으로 일반화 성능을 평가했습니다."
        text_en: "Built fire-line, weather and terrain raster time series for four wildfires in ArcGIS and trained a U-LSTM (conv encoder–LSTM–decoder) to predict the next fire line, holding out one event as an unseen test set."
    links: []

