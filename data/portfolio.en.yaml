    projects:
      - id: data-projects
        digest: {"problem": "I needed work in my target fields (energy, resources, manufacturing, finance) that goes from collection to validation on real data", "role": "Personal project · collection, cleaning, modelling, validation, automation", "did": ["Incremental USGS earthquake collection → revision handling and quarantine counts → CSV/SQLite → b-value analysis → a dashboard updated daily", "Per-component anomaly detection, streaming alerts and supervised diagnosis on UCI hydraulic-rig sensors, comparing random vs time-block splits", "Day-ahead power demand forecasting from KPX 2025 hourly demand plus temperature (baseline, linear, GBM, ensemble)", "OpenDART data mart: pivot, LAG and RANK SQL views and evidence search over business reports", "The same data modelled in dbt as staging → intermediate → marts and run by an Airflow DAG — data tests, earthquake revision history (SCD type 2), safe re-runs"], "result": ["Power demand MAPE: 6.17% for the same-hour-last-week baseline → 3.23% for the ensemble · daily-peak error 2.64%", "dbt warehouse: 6 sources · 35 models · 101 data tests passing, with a daily run log and dashboard", "Sensor diagnosis: 0.99 with a random split fell to 0.46 with a time split — the split changes the conclusion", "134 automated tests across 8 folders passing in CI · daily collection and deployment with GitHub Actions"]}
        tagline: "Eight projects that collect and model public data daily and monitor data quality and API health"
        key: "Accuracy 0.99 on a random split fell to 0.46 on a time split — the evaluation choice changed the conclusion · power demand MAPE 3.23% (vs 6.17% for the same-hour-last-week baseline)"
        short: "Public-data projects"
        title: "Public-data projects — earthquake pipeline · equipment anomaly detection · power demand forecasting · DART data mart · dbt warehouse"
        type: Personal project
        org: Personal · GitHub (data-projects)
        period: { start: "2026.11", end: "present" }
        team: "Solo"
        role: Collection · cleaning · modelling · validation · automation
        tags: [Python, SQL, dbt, DuckDB, Airflow, Docker, scikit-learn, GitHub Actions, Time series]
        summary: Data pipelines, anomaly detection, demand forecasting and a SQL data mart built on public data from energy, resources, manufacturing and finance, validated with time-ordered evaluation
        star:
          situation: I needed examples on real data from my target fields (resource development, energy, manufacturing IT, finance) that go from collection to validation, and the joint-research data cannot be published
          task: Build projects that run repeatedly like production work and are evaluated honestly, using only data anyone can download
          action:
            - "Earthquake pipeline: incremental collection from the USGS FDSN API with per-region minimum magnitude and start date (re-fetching the last 3 days so runs are idempotent); only newer revisions replace an event; events without magnitude, out of range or non-earthquake are quarantined and counted; CSV (source) and SQLite (query) storage; Mc and b-value (Aki–Utsu, Shi & Bolt error); a Leaflet dashboard refreshed daily by GitHub Actions"
            - "Equipment anomaly detection: 136 cycle features from 2,205 cycles × 17 sensors of the UCI hydraulic rig; per-component normal models (Ledoit-Wolf Mahalanobis, 1% false-alarm threshold) with a k-consecutive alert rule; RandomForest vs LDA diagnosis under random and time-block splits"
            - "Power demand forecasting: day-ahead 24-hour forecasts from KPX 2025 national hourly demand and Open-Meteo temperature — features use only values at least 24 hours old (with a leakage test), holidays included; baseline, linear, GBM and ensemble tested on October–December"
            - "DART data mart: OpenDART collection (status-code handling, rate-limit waits), standardised accounts, pivot/LAG/RANK SQL views, and evidence search over business-report paragraphs with character-bigram BM25, returned with sources (API key only via Secrets)"
            - "Analysis warehouse: eight questions on power demand, temperature, solar irradiance and data-job postings, each answered by dbt analysis tables — a two-segment temperature model on weekdays (breakpoints found by a 0.5 °C grid search), day types re-classified with a holiday seed to compare days off and long holidays, peak hour by season, the spring midday dip and a test of its cause (a month-fixed-effect regression gives −2,704 MW of midday demand per 100 W/m² of irradiance, while the 20:00–23:00 placebo shows +11 MW, i.e. no effect — consistent with unmetered solar), and skill mentions by data role. Sources are modelled in dbt (DuckDB) as staging → intermediate → marts → analysis, with the hour's start time as key so '24:00' never slips into the next day · the Airflow DAG, CLI and tests share the same functions"
            - "Power-transition analysis: Ember monthly generation and Our World in Data energy data (keyless open data) analysed with seven SQL queries — Korea's 25-year electricity mix, coal decline vs 11 other countries, solar growth and seasonality, carbon intensity — published as a D3 dashboard with an animated year scatter; coal 46.3% (2009) → 31.1% (2025), solar share peaks in May (7.6%) vs December (3.4%), the same direction as the warehouse's spring midday dip"
            - "API monitoring (API Watch): checks 22 public APIs on a regular schedule — beyond HTTP 200 it flags stale data, empty results, duplicates and type changes, stores the first healthy schema to tell added fields from removed or retyped ones, and groups repeated failures into one issue (includes a Django admin and Docker Compose version)"
            - "Wildfire risk map: compares the Fosberg fire weather index with NASA satellite fire detections daily — most detections are persistent heat sources such as steelworks, so rules filter them out"
            - "Data agent: an MCP server that lets an LLM query these results in SQL — read-only SQL guards and a check that numbers in the answer match the query results"
          result:
            - "Power demand: MAPE 6.17% for the same-hour-last-week baseline → 3.23% for the ensemble; daily-peak error 2.64%"
            - "Sensor diagnosis: RandomForest scored 0.99+ on every component with a random split but 0.46 on the valve with a time-block split; LDA kept 1.00 on cooler, valve and pump, while the accumulator (0.55) remains open"
            - "Earthquakes: b = 1.11 ± 0.05 on 2,474 events of M4+ in East Asia (the catalogue updates daily) · 39 tests across the four projects"
            - "Analysis: above 17.5 °C weekday demand rises +1,636 MW per °C, below 13 °C +969 MW (R² 0.83); Saturdays −10.8% and Sundays/holidays −16.7% vs weekdays; Lunar New Year and Chuseok −21.6% and −18.7% vs nearby weekdays; on 14 of 22 April weekdays midday demand fell below the night minimum · data-engineer postings mention SQL 90% and Spark 68%, data-analyst postings SQL 51% and Tableau 27% (107 postings over one week, so no trend claims yet)"
            - "Warehouse: 44 models (12 analysis tables) · 129 dbt tests · 42 pytest cases; the analysis dashboard is recomputed daily · Airflow verified for a single DAG run only (not operated continuously)"
            - "API monitoring: success rate is reported only as the share of observed checks (not called uptime), and the rules are covered by 34 tests — about 130 pytest tests across the eight projects"
