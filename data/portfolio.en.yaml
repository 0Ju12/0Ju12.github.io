        summary: A Korean web and Android app that works out menus, missing ingredients and the time left after cooking from fridge stock (weight and use-by date), and turns one sentence about your situation into a recommendation, a shopping list and a cooking mode
        star:
          situation: "Having tofu in the fridge doesn't tell you whether it's enough for two, whether it must be used this week, or whether there's time to work out after cooking. In SSAFY AI core project 3 (solo) I built the agent at the centre of this, and I'm extending it into the final project."
          task: "Solo, from planning and design (use cases, system, ERD) to the agent, FastAPI backend, web UI and Android shell. Goal: even when the model is wrong, numbers like stock and portions must not be."
          action:
            - "Agent flow: LangGraph analyse (model: natural language → conditions) → plan (rules fix the core tasks; the model only picks helper tools from the tool list via a structured Plan output) → execute (worker) → judge (stock, use-by date, missing grams, cooking time — in code) ⟲ replan (max 3) → verify → respond (sentences from confirmed values only)"
            - "Safeguards: unregistered tools and duplicate tasks are dropped in code; if the model call fails the rule plan carries on alone · a missing provider key is reported as MISSING_KEY with a direct search link · keys and raw exceptions never reach user replies or run logs"
            - "Task chaining: 'I want kimchi stew — what do I need to buy?' → recipe lookup → compare with fridge stock → pass only the missing ingredients to shopping search. 'Two of us, only what we have' applies servings and leaves the cart alone · every action is shown with an undo button"
            - "Run records: event bus → logging agent (no LLM) → SQLite subscription stores analyse/plan/execute/judge/respond with tool arguments, latency and replan reasons, and flags duplicate calls, off-plan calls, repeated failures of one tool and the replan cap — logging errors never block the conversation"
            - "Grounded answers (RAG): 31 guide documents summarising public sources (nutrient intake standards, food safety, exercise guidelines, with source links) indexed in Chroma; questions no API can answer get evidence paragraphs and sources, or 'not found' when nothing relevant exists"
            - "Domain: 110 hand-written single-serving recipes (calories and protein from USDA references), package-level stock with use-by dates, a cooking mode that recomputes missing grams when servings change, skill-level workout routines with set timers, schedule-overlap checks and back-calculated cooking start times"
            - "Fixed defects: re-sending after a lost response could double water/intake records → the first request ID is reused so the server total rises once · beef stayed in plant-based candidates → ingredient categories were tightened and external recipes whose ingredients can't be verified are excluded from automatic candidates"
            - "UI and delivery: web with mobile bottom tabs and a desktop sidebar, Android WebView shell (notifications, Health Connect daily totals preview), debug APK and unsigned AAB builds, per-browser data isolation checked in the Docker production image"
            - "Tests: pytest with a stand-in model (fake LLM) and fixed provider responses, so it runs without keys; run on GitHub Actions"
