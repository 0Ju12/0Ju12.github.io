    projects:
      - id: masters
        digest: {"problem": "Salt and basement signals overlap beneath 8–10 km of sediment; earlier interpretation put the salt far too shallow (~6,000 m vs ~9,300 m)", "role": "Proposed a method to separate the two signals in airborne gravity and magnetic data (M.S. researcher)", "did": ["Built a WCF pipeline computing the gravity–magnetic correlation CC(k) in the wavenumber domain", "Designed two indices: SLFI for basement, DLFI for salt", "Cross-checked against 3 independent models, profiles and a 3D density model", "Calgary stay · three-institution collaboration incl. Khalifa Univ."], "result": ["SLFI basement agrees with 3 existing models at r ≥ 0.94", "Suggested an additional salt uplift west of Ghasha", "First-author SPE Journal (SCIE) paper · M.S. thesis (2026)"]}
        tagline: "Wavenumber-domain correlation → basement (SLFI) and salt (DLFI) indices"
        key: "Agrees with 3 independent models at r ≥ 0.94"
        short: "Thesis research"
        title: Wavenumber correlation of gravity & magnetic data for salt/basement structure (M.S. · SPE Journal first author)
        type: Research
        org: Geophysical Computing Lab · Dept. of Environment and Energy
        period: { start: "2024.03", end: "2026.08" }
        role: Graduate researcher
        tags: [Signal processing, Correlation analysis, Index design, Gravity & magnetic data]
        summary: Separated overlapping gravity and magnetic signals in the wavenumber domain to resolve salt and basement structures offshore Abu Dhabi
        star:
          situation: In the Ghasha field offshore Abu Dhabi, salt and basement lie under 8–10 km of sediments, so gravity and magnetic signals overlap; earlier methods put the salt at ~6,000 m, far shallower than the ~9,300 m seen in seismic data
          task: Propose an analysis that separates basement and salt signals in airborne gravity and magnetic data
          action:
            - Built a wavenumber correlation filtering (WCF) pipeline — upward continuation and normalization, then the correlation coefficient CC(k) between the two signals at each wavenumber
            - Designed two indices — SLFI from positively correlated components (basement) and DLFI from weak/negative ones (salt)
            - Chose thresholds from energy–correlation trade-off curves instead of by eye (upward continuation 1,500 m at the knee point; SLFI band 0.5–1.0 keeps ~half the energy at correlation 0.85)
            - Validated against three independent published models with map, profile and 3-D density comparisons
            - "Presented Abu Dhabi processing and analysis results at 10+ regular lab research meetings (2024.05–2026.01) and at the 2025.11 Basic Research Lab workshop"
            - "Researcher on national R&D projects, including the IITP global talent program"
          result:
            - SLFI basement structure agrees with three independent models at r ≥ 0.94 (profile correlation 0.95–0.98 after shift alignment)
            - DLFI reproduces the salt distribution and suggests an additional salt uplift west of Ghasha
            - First-author paper in SPE Journal (SCIE, 2026, with Univ. of Calgary and Khalifa Univ.) · 3 conference talks (2024)
            - M.S. degree conferred 2026.08.21
        links:
          - { label: SPE Journal paper, url: "https://doi.org/10.2118/236968-PA" }
          - { label: Code (gravmag-wcf), url: "https://github.com/0Ju12/gravmag-wcf" }
