        digest: {"problem": "Lecture notes, interview answers and cover letters must not be public, but I wanted to review and practise on both phone and PC", "role": "Personal project · planning through encryption and UI", "did": ["Study app that turns 52 lecture notes into 1,545 practice questions, keyword cards, cloze items, weakness reports and mock exams", "Interview app: question bank, timed/recorded mock interviews, decks (PDF/PPTX generated in the browser), recruiting info for 38 organisations, 30 cover-letter prompts, goal D-days", "Every page and the search index encrypted with PBKDF2 (600k) + AES-GCM; one unlock per tab covers both apps", "Offline use (PWA) and password-protected files to merge progress between devices"], "result": ["Runs encrypted on GitHub Pages with no server — no plaintext in the repository or the deployment", "A scheduled job adds interview questions every Mon/Thu as sealed files, merged in the deploy build", "Main desktop and phone flows pass automated checks"]}
        tagline: "Web apps that use private study and interview material while keeping it encrypted"
        key: "PBKDF2 600k + AES-GCM · no server, no plaintext"
        short: "Study & interview apps"
        title: "Encrypted study notes & interview-prep apps — a PBKDF2 · AES-GCM PWA on static hosting"
        type: Personal project
        org: Personal · GitHub Pages
        period: { start: "2026.11", end: "present" }
        team: "Solo"
        role: Planning · design · development
        tags: [JavaScript, Web Crypto, PWA, Python, cryptography, Playwright]
        summary: Study and interview-practice apps whose content is encrypted at build time, hosted as a static site and decrypted in the browser with a password
        star:
          situation: SSAFY lecture notes, interview answers and cover letters cannot go into a public repository, yet I needed to review and practise on my phone while on the move — without running a server
          task: Deploy the content encrypted using only static hosting (GitHub Pages), so that only someone with the password can open it in the browser
          action:
            - "Encryption: at build time each page is sealed with AES-GCM under a key derived by PBKDF2-SHA256 (600k iterations) and decrypted with the browser's Web Crypto; one key per build, so a single unlock per tab opens both apps. Builds without a password emit empty lock pages only"
            - "Study app: titles, outlines and summaries extracted from 54 notes; 1,545 practice questions (multiple choice, cloze, written), keyword cards, weakness report and mock exams; the full-text index is gzipped and encrypted with the same key; spaced review at 1·3·7·14·30 days"
            - "Interview app: question bank with typical vs strong answers, answer skeletons and decks generated from portfolio data (presenter mode; PDF/PPTX built in the unlocked browser), timed/recorded mock interviews, an OPIc practice set, recruiting info for 38 organisations, 30 cover-letter prompts with core-experience balancing, goal D-days and weekly checks"
            - "Operation: the scheduled job adds new questions as public-key-sealed add-on files without the private key and the deploy build merges them; math fonts moved to one shared file to cut note size by more than half; progress moves between devices as password-protected files that merge rather than overwrite"
          result:
            - "Runs on GitHub Pages with no server and leaves no plaintext in the repository or the deployment · moving math fonts to a shared file cut encrypted notes from about 44 MB to 20 MB"
            - "Bottom tab bar on phones and offline install (PWA); main desktop and phone flows pass automated checks"
        links:
          - { label: "Lock screen", url: "https://0ju12.github.io/interview/" }

