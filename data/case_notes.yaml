# 프로젝트 상세 페이지(docs/projects/<id>.html)용 보충 내용 — portfolio.yaml의 하위 프로젝트 id 기준
# tradeoffs: 설계 판단 · 트레이드오프 / next: 다시 한다면 · 남은 과제
# 근거: content/posts의 각 글('배운 것' · '지금 돌아보면' · '데이터 일로 가져가는 것')과 portfolio.yaml의 STAR 내용
# demo: 데모 GIF 경로, diagram: 구조도 이름(templates/diagrams/<이름>.html.j2)

masters:
  diagram: masters
  ko:
    tradeoffs:
      - "상관계수 구간: 구간을 좁히면 두 데이터의 상관은 높아지지만 남는 신호 에너지가 줄어듦 → '상관계수'와 '남는 에너지 비율'을 함께 그려 균형점(SLFI는 CC 0.5~1.0, 신호 에너지 약 절반 유지)을 고름. 임계값을 감으로 정하지 않고 그래프로 설명할 수 있게 함"
      - "상향 연속 높이: 높일수록 얕은 잡음은 줄지만 해상도가 떨어짐 → 상관계수 변화 곡선이 꺾이는 지점(1,500 m)을 계산해 선택"
      - "검증 기준: 같은 데이터로 만든 기준은 검증이 될 수 없다고 보고, 해석법이 다른 독립 모델 3개와 공간·측선·3D 밀도 단면으로 비교 — 기준을 구하기 어려운 대신 순환 검증을 피함"
    next:
      - "DLFI가 새로 보여 준 가샤 서쪽의 추가 암염 융기 가능성은 탄성파 등 다른 자료로 확인이 필요한 가설로 남아 있음"
      - "실제 자료는 공동연구 데이터라 공개하지 않고, 같은 흐름을 합성 데이터로 재현하는 코드(gravmag-wcf)로 정리 — 다른 지역 자료에도 같은 절차를 적용해 보는 것이 다음 단계"
  en:
    tradeoffs:
      - "Correlation band: a narrower band raises the correlation but leaves less signal energy, so I plotted correlation and retained-energy ratio together and picked the balance point (SLFI: CC 0.5–1.0, keeping about half the energy) — a threshold that can be explained with a graph, not by feel."
      - "Upward-continuation height: higher reduces shallow noise but blurs resolution; I chose the knee of the correlation-change curve (1,500 m)."
      - "Validation reference: a reference built from the same data is not validation, so I compared against three independent models from different methods (map overlay, four profiles, 3D density sections) — harder to obtain, but avoids circular validation."
    next:
      - "The additional salt uplift west of Ghasha suggested by DLFI remains a hypothesis to confirm with other data such as seismic."
      - "The real data belong to the joint project and stay private; the workflow is reproduced on synthetic data in gravmag-wcf. Applying the same procedure to another region is the next step."

calgary-2024:
  ko:
    tradeoffs:
      - "단위도 깊이 감도도 다른 두 물리량(중력·자력)을 함께 쓰는 대신, 먼저 정규화하고 파수 영역의 상관(위상)으로 비교 가능한 형태로 맞추는 과정을 거침"
  en:
    tradeoffs:
      - "Using two quantities with different units and depth sensitivity (gravity and magnetics) meant first normalizing them and comparing them through wavenumber-domain correlation (phase)."

undergrad-research:
  ko:
    tradeoffs:
      - "저장소 하나를 깊게 파는 대신 4개 지역 8개 프로젝트를 같은 틀(판구조 형성사 → 저장층·덮개암 구조)로 비교 — 개별 정량 분석보다 공통 패턴을 찾는 데 우선순위를 둠"
    next:
      - "지금 돌아보면: 결과가 수치상 좋아 보여도 '생성 과정을 알고 보니 말이 된다'가 더 강한 근거였음. 머신러닝에서 도메인 제약·사전 지식이 하는 역할과 같아서, 이후 석사 연구에서 독립 모델과 비교하는 습관으로 이어짐"
      - "제시한 기준(지질학적으로 비현실적인 속도 모델 배제)을 실제 국내 탐사 자료 처리에 적용해 보는 것은 남은 과제"
  en:
    tradeoffs:
      - "Instead of going deep on one site, I compared eight projects in four regions with the same frame (plate-tectonic history → reservoir and caprock structure), prioritizing common patterns over per-site quantitative analysis."
    next:
      - "Looking back: even when results look good numerically, 'it makes sense once you know how it formed' is the stronger evidence — the role domain constraints play in ML. It became the habit of comparing with independent models in my M.S. work."
      - "Applying the proposed criterion (ruling out geologically unrealistic velocity models) to real domestic survey data remains open."

wildfire-capstone:
  ko:
    tradeoffs:
      - "산불 4건뿐인 적은 데이터 → 모델 용량을 키우는 대신 파라미터 2,736개의 얕은 네트워크로 줄이고, 길이 1~19 슬라이딩 윈도우로 학습 샘플(배치 151개)을 늘림"
      - "일반화 검증을 위해 산불 1건(강릉)을 학습에서 통째로 빼서 테스트 — 학습 데이터는 더 줄지만 '처음 보는 산불'에서의 성능을 확인"
    next:
      - "당시에는 구조 이름만 보고 텐서가 실제로 흐르는 축을 끝까지 확인하지 않았음 — LSTM이 시간이 아니라 공간 축을 보고 있었다는 점을 나중에 알게 됨"
      - "다시 만든다면 ConvLSTM, 사건(산불) 단위 교차검증, Dice loss + IoU, 위성 영상 기반 화선 자료부터 추가"
  en:
    tradeoffs:
      - "Only four fires of data: instead of a bigger model, a shallow network with 2,736 parameters, and sliding windows of length 1–19 to grow the training set to 151 batches."
      - "For a fair generalization check, one entire fire (Gangneung) was held out for testing — less training data, but a real 'unseen fire' result."
    next:
      - "I didn't trace which axis the tensors actually flowed along; I later realized the LSTM was looking at the spatial axis rather than time."
      - "If I rebuilt it: ConvLSTM, event-level cross-validation, Dice loss + IoU, and satellite-based fire-front data."

hankki:
  ko:
    tradeoffs:
    - '한끼: 핵심 작업은 규칙이 정하고 모델은 보조 도구만 고르게 함 — 모델에게 계획 전체를 맡기는 것보다 유연성은 줄지만, 모델이 틀리거나 실패해도 재고·분량 계산과 기본 추천은 그대로 동작'
    - '실행 기록: 로깅 에이전트는 모델을 쓰지 않고 이벤트 규칙(중복·계획 밖 호출·연속 실패·재계획 상한)으로 판정 — 미묘한 이상은 놓칠 수 있지만, 기록이 빠르고 매번 같은 결과가 나오며 비용이 들지 않음'
    - '테스트: 대역 모델과 고정된 API 응답으로 키 없이 돌게 함 — 매번 같은 결과를 얻는 대신 실제 모델의 해석 품질과 응답 시간은 이 테스트로 측정하지 않음'
    next:
    - 실제 발급 키로 대표 시나리오를 다시 돌려 응답 시간(목표 5초 이내)과 실패율을 기록하고, 추천을 받은 요청 중 실제 조리로 이어진 비율을 재고 입력 방식·식단 목표별로 나눠 측정할 계획입니다.
  en:
    tradeoffs:
    - 'Hankki: rules fix the core tasks and the model only picks helper tools — less flexible than letting the model plan everything, but stock/portion maths and the basic recommendation keep working when the model is wrong or down.'
    - 'Run records: the logging agent uses event rules (duplicates, off-plan calls, repeated failures, replan cap) instead of an LLM — subtle anomalies can slip through, but logging is fast, deterministic and free.'
    - 'Tests: a stand-in model and fixed provider responses let tests run without keys — deterministic, but they do not measure the real model''s interpretation quality or latency.'
    next:
    - 'Next: re-run the representative scenarios with real keys to record latency (target under 5 s) and failure rate, and measure how many recommendations turn into actual cooking, split by stock-entry style and diet goal.'
heritage:
  demo: assets/demo/heritage-rag-demo.gif
  demo_caption_ko: 국보 입문 가이드 — 국보를 고르고 질문하면 실제로 인용한 근거만 표시 (API 키 없이 도는 데모 모드)
  demo_caption_en: Heritage RAG guide — pick a national treasure, ask, and see only
    the evidence actually cited (offline demo mode, no API key)
  ko:
    tradeoffs:
    - '국보 가이드: 근거 번호를 검색 단계에서 고정하고 LLM은 가리키기만 하게 함 — 답변 표현의 자유는 줄지만 인용 검증이 단순한 집합
      비교가 됨'
    - '테스트: 외부 API 대신 mock·가짜 LLM으로 결정적인 테스트를 만듦 — 빠르고 매번 같은 결과가 나오는 대신, 실제 모델의 답변
      품질은 측정하지 않음'
    next:
    - 고정 질문 9개와 similarity/MMR 비교 평가 도구를 마련했습니다. 공개 오프라인 보고서는 가짜 LLM 검증용이며, 실제 모델의
      답변 품질·비용은 별도로 실행·기록해야 합니다.
  en:
    tradeoffs:
    - 'Heritage guide: evidence numbers are fixed at retrieval and the LLM only points
      to them — less freedom in phrasing, but citation checking becomes a simple set
      comparison.'
    - 'Tests: mocks and a fake LLM instead of external APIs — fast and deterministic,
      but they don''t measure the real model''s answer quality.'
    next:
    - A nine-question gold set and similarity/MMR evaluation tools are available.
      The published offline report validates a fake-LLM setup; real-model quality
      and cost still require measured runs.
vqa:
  ko:
    tradeoffs:
    - 'VQA 챌린지: 새 후보를 정확도 대신 고친 문제와 새로 틀린 문제(fixes−breaks)·유형별 회귀로 채택 — 점수 상승 폭만 보는
      것보다 느리지만 ''믿을 수 있게 오른'' 제출만 남김'
    next:
    - Public Score를 일반화 성능으로 해석하지 않고, 후보 선택에 쓰지 않은 독립 검증셋과 유형별 회귀를 별도로 평가하는 것이 다음
      단계입니다.
  en:
    tradeoffs:
    - 'VQA challenge: candidates were adopted by fixes−breaks and per-type regressions
      instead of accuracy — slower than chasing the score, but only ''reliably better''
      submissions remain.'
    next:
    - 'Next: evaluate on an independent holdout that was not used to select candidates;
      do not treat the public leaderboard as generalization performance.'

posco-pospeak:
  ko:
    tradeoffs:
      - "'쉬운 단어 교정부터 어려운 문맥 교정으로' 순차 학습이 직관적이었지만, 같은 조건에서 3가지 전략을 비교해 보고 결정 — 실험 비용은 들었지만 catastrophic forgetting을 발견하고 통합 학습으로 전환"
      - "각 학습 단계 직후의 성능을 따로 기록 — 마지막 점수만 봤다면 '그냥 성능이 낮다'로 끝났을 원인을 찾을 수 있었음"
    next:
      - "순차 학습이 꼭 필요한 상황이라면 이전 데이터를 일부 섞는 replay나 가중치 변화를 제한하는 정규화(EWC 등)를 검토 — 이번에는 데이터가 크지 않아 통합 학습이 가장 단순하고 효과적이었음"
  en:
    tradeoffs:
      - "Sequential training (easy word-level first, then context) felt intuitive, but I compared three strategies under the same conditions — extra experiments, but it surfaced catastrophic forgetting and led to joint training."
      - "Performance was logged right after each stage; looking only at the final score would have ended at 'it's just low'."
    next:
      - "If sequential training is required, consider replay (mixing in earlier data) or regularization such as EWC; here the data were small enough that joint training was simplest and best."

portfolio-site:
  ko:
    tradeoffs:
      - "프레임워크(Next.js 등) 대신 Python + Jinja2 정적 생성: 화려한 기능은 줄지만, 데이터(YAML)와 화면을 분리해 같은 데이터로 사이트·이력서 PDF·노션 문구를 함께 만들 수 있고 빌드가 단순해짐"
      - "점검을 사람이 아닌 빌드에 맡김: 배포가 조금 느려지는 대신 깨진 링크·필수 항목 누락·휴대폰 가로 넘침·1쪽 이력서 넘침을 배포 전에 잡음"
      - "비공개 자료는 공개키로만 잠가 커밋: 정기 작업도 개인키 없이 자료를 추가할 수 있지만, 푸는 것은 비밀 키가 있는 배포 빌드에서만 가능"
    next:
      - "방문 통계(GoatCounter)를 연결해 어떤 프로젝트·이력서가 실제로 읽히는지 보고 순서를 정하는 것"
      - "영문 페이지는 국문 데이터를 따로 번역해 관리하고 있어, 항목 누락을 자동으로 비교하는 점검을 추가할 계획"
  en:
    tradeoffs:
      - "Python + Jinja2 static generation instead of a framework such as Next.js: fewer flashy features, but data (YAML) and presentation stay separate, so the same data produces the site, resume PDFs and Notion text, and the build stays simple."
      - "Checks belong to the build, not to me: deploys are a little slower, but broken links, missing fields, phone overflow and a 1-page resume spilling over are caught before release."
      - "Private material is committed only sealed with a public key: scheduled jobs can add material without the private key, while unsealing happens only in the deploy build that holds the secret."
    next:
      - "Connect visitor analytics (GoatCounter) to see which projects and resumes are actually read, and order them accordingly."
      - "The English data is maintained as a separate translation; an automatic check that compares it with the Korean data for missing items is planned."

prep-apps:
  ko:
    tradeoffs:
      - "서버·로그인 대신 빌드 시 암호화 + 브라우저 복호화: 계정 관리·서버 비용이 없지만, 암호 하나로 전체를 여는 구조라 암호를 바꾸면 다시 빌드해야 함. 반복 횟수(PBKDF2 60만 회)로 추측 공격 비용을 높임"
      - "기록은 브라우저에만 저장: 개인정보가 서버로 가지 않는 대신 기기 간 자동 동기화는 없음 → 암호를 건 파일로 옮겨 '덮어쓰기'가 아닌 '합치기'(연습 횟수가 많은 쪽, 나중에 고친 메모 우선)로 보완"
      - "PDF·PPTX는 서버에 미리 만들지 않고 잠금을 푼 브라우저에서 생성: 버튼을 누를 때 조금 기다리지만, 암호 없이 받을 수 있는 평문 파일이 배포본에 남지 않음"
    next:
      - "여러 기기에서 자동으로 이어 쓰려면 종단간 암호화한 기록을 저장할 작은 저장소가 필요 — 지금은 파일 옮기기까지만 구현"
      - "OPIc 녹음을 음성 인식으로 글자로 바꿔 말한 길이·반복 표현을 보여 주는 기능"
  en:
    tradeoffs:
      - "Build-time encryption with in-browser decryption instead of a server and logins: no accounts or hosting cost, but one password opens everything and changing it means rebuilding. PBKDF2 at 600k iterations raises the cost of guessing."
      - "Progress lives only in the browser: nothing personal goes to a server, but there is no automatic cross-device sync, so password-protected files move it and merge rather than overwrite (more practice wins; the later memo wins)."
      - "PDF and PPTX are generated in the unlocked browser rather than pre-built: a short wait on click, but no plaintext file downloadable without the password is left in the deployment."
    next:
      - "Automatic sync across devices needs a small store for end-to-end encrypted progress — currently only file transfer is implemented."
      - "Speech-to-text on OPIc recordings to show answer length and repeated phrases."

data-projects:
  ko:
    study:
      title: "사례 연구 · 맑은 날 한낮 전력 수요는 정말 더 내려갈까"
      big: "−2,704 MW"
      big_label: "일사량 100 W/m²당 평일 한낮(11~14시) 수요 변화 · 95% 구간 −2,986 ~ −2,422 · R² 0.91"
      steps:
        - ["문제", "4월 평일 22일 중 14일은 한낮 수요가 그날 새벽 최저보다 낮았고, 여름에는 이런 날이 없었음"]
        - ["가설", "전력거래소가 계량하지 않는 소규모 태양광이 맑은 날 한낮 수요를 깎는다 — 맞다면 ① 같은 달 안에서도 맑은 날 한낮이 낮고 ② 해가 진 뒤에는 차이가 없어야 함"]
        - ["방법", "4개 도시 시간별 일사량(Open-Meteo)을 수요와 '끝 시각' 기준으로 맞추고, 달별 절편·새벽 최저·냉난방 기온항을 넣은 회귀로 비교 · 20~23시 수요를 대조군으로 둠"]
        - ["결과", "12개월 모두 맑은 날 한낮이 낮았고, 같은 식을 저녁에 맞추면 +11 MW(95% 구간 −151 ~ 173)로 0과 구분되지 않음 → 두 예측 모두 맞음"]
        - ["한계", "흐린 날 조명 효과는 떼어 내지 못했고, 수평면 일사량이라 설비 용량으로 바꿔 읽지 않으며, 전력거래소 추정치와는 아직 대조하지 않음"]
      chart_title: "계절별로 따로 맞춘 계수 (MW / 100 W/m²) · 회색은 해가 진 뒤 대조군"
      chart: [["겨울", -4088], ["봄", -2353], ["여름", -1998], ["가을", -3405], ["저녁 대조군", 11]]
      link: ["분석 과정 글 읽기", "../posts/2026-11-solar-midday-demand.html"]
    tradeoffs:
      - "평가 분할: 이웃한 시점이 거의 같은 시계열에서 무작위 분할은 성능을 부풀림 → 센서 진단과 수요 예측 모두 '과거로 학습해 미래를 시험'하는 시간 분할을 기본으로 하고, 무작위 분할 결과를 옆에 같이 보고"
      - "지진 파이프라인 저장: 사람이 읽고 diff 할 수 있는 CSV를 원본으로, SQLite는 매번 다시 만드는 질의용으로 — 파일은 조금 커지지만 변경 이력이 저장소에 그대로 남음"
      - "DART 근거 검색: 생성형 답변 대신 원문 문단과 출처만 돌려줌 — 문장이 매끄럽지 않은 대신 틀린 요약을 만들 위험이 없음"
    next:
      - "축압기 진단(0.55)은 모델보다 압력 상승 구간의 시정수 같은 특징이 더 필요해 보임"
      - "전력 수요는 1년치만 공개돼 같은 계절을 두 번 학습하지 못함 — 여러 해 자료와 실제 기온 예보로 다시 평가할 계획"
      - "지금 비교 기준은 '지난주 같은 시각'이라는 단순 기준선 — 3.23%는 이 기준선 대비 개선이며, 전력거래소 공식 하루 전 예측보다 낫다는 뜻이 아님. 공식 예측치를 같은 기간으로 받아 나란히 비교하는 것이 다음 단계"
  en:
    study:
      title: "Case study · Does weekday midday demand really drop on sunny days?"
      big: "−2,704 MW"
      big_label: "Change in weekday midday (11:00–14:00) demand per 100 W/m² of irradiance · 95% CI −2,986 to −2,422 · R² 0.91"
      steps:
        - ["Problem", "On 14 of 22 April weekdays, midday demand fell below that day's overnight minimum; in summer it never did"]
        - ["Hypothesis", "Small-scale solar that the grid operator does not meter cuts midday demand on sunny days. If so, (1) sunny middays should be lower even within the same month, and (2) there should be no gap after sunset"]
        - ["Method", "Hourly irradiance for four cities (Open-Meteo) aligned to demand by interval end; regression with month intercepts, overnight minimum and heating/cooling temperature terms; 20:00–23:00 demand as a placebo"]
        - ["Result", "Sunny middays were lower in all 12 months, while the same model on evening demand gives +11 MW (95% CI −151 to 173), indistinguishable from zero — both predictions held"]
        - ["Limits", "Extra lighting on cloudy days is not separated out; irradiance is horizontal so the coefficient is not read as installed capacity; not yet compared with the operator's own estimate"]
      chart_title: "Coefficient fitted per season (MW per 100 W/m²) · grey is the after-sunset placebo"
      chart: [["Winter", -4088], ["Spring", -2353], ["Summer", -1998], ["Autumn", -3405], ["Evening placebo", 11]]
      link: ["Read the full write-up (Korean)", "../posts/2026-11-solar-midday-demand.html"]
    tradeoffs:
      - "Evaluation split: in time series where neighbouring points are nearly identical, random splits inflate scores, so both the sensor diagnosis and the demand forecast default to time-ordered splits (train on the past, test on the future), with random-split results reported alongside."
      - "Earthquake storage: a human-readable, diff-able CSV is the source of truth and SQLite is rebuilt for queries — slightly larger files, but every change stays visible in the repository history."
      - "DART evidence search returns source paragraphs instead of generated answers — less fluent, but no risk of a wrong summary."
    next:
      - "Accumulator diagnosis (0.55) seems to need features such as the time constant of pressure build-up more than a different model."
      - "Only one year of demand data is public, so no season is seen twice; I plan to re-evaluate with several years and real temperature forecasts."
      - "The current reference is a naive same-hour-last-week baseline — 3.23% is an improvement over that baseline, not a claim of beating the grid operator's official day-ahead forecast. Comparing against the official forecast over the same period is the next step."
