ghasha:
  wiki_title: Ghasha va Shiryul
  wiki_url: https://en.wikipedia.org/wiki/Ghasha_va_Shiryul
  extract: Ghasha va Shiryul is a village in Chenaneh Rural District, Fath Olmobin
    District, Shush County, Khuzestan Province, Iran. At the 2006 census, its population
    was 469, in 76 families. The Karkheh River flows to the east.
forge:
  wiki_title: Frontier Observatory for Research in Geothermal Energy
  wiki_url: https://en.wikipedia.org/wiki/Frontier_Observatory_for_Research_in_Geothermal_Energy
  extract: The Frontier Observatory for Research in Geothermal Energy (FORGE) is a
    US government program supporting research into geothermal energy. The FORGE site
    is near Milford, Utah, funded for up to $140 million. As of 2023, numerous test
    wells had been drilled, and flux measurements had been conducted, but energy production
    had not commenced.
weyburn:
  wiki_title: Weyburn-Midale Carbon Dioxide Project
  wiki_url: https://en.wikipedia.org/wiki/Weyburn-Midale_Carbon_Dioxide_Project
  extract: The Weyburn-Midale Carbon Dioxide Project was a large carbon capture and
    storage project. It has however been overtaken in terms of carbon capture capacity
    by projects such as the Shute Creek project and the Century Plant. It is located
    in Midale, Saskatchewan, Canada.
northernlights:
  wiki_title: Carbon capture and storage
  wiki_url: https://en.wikipedia.org/wiki/Carbon_capture_and_storage
  extract: Carbon capture and storage (CCS) is a process by which carbon dioxide (CO2)
    from industrial installations or natural sources is separated before it is released
    into the atmosphere, then transported to a long-term storage location. The CO2
    is captured from a large point source, such as a natural gas processing plant
    and is typically stored in a deep geological formation. Around 80% of the CO2
    captured annually is used for enhanced oil recovery (EOR), a process by which
    CO2 is injected into partially depleted oil reservoirs in order to extract more
    oil and then is largely left underground. Since EOR utilizes the CO2 in addition
    to storing it, CCS is also known as carbon capture, utilization, and storage (CCUS).
  image_skipped: https://upload.wikimedia.org/wikipedia/commons/5/5e/CBO-how-carbon-capture-works.png?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled
sleipner:
  wiki_title: Sleipner gas field
  wiki_url: https://en.wikipedia.org/wiki/Sleipner_gas_field
  extract: The Sleipner gas field is a natural gas field in the block 15/9 of the
    North Sea, about 250 kilometres (160 mi) west of Stavanger, Norway. Two parts
    of the field are in production, Sleipner West, and Sleipner East (1981). The field
    produces natural gas and light oil condensates from sandstone structures about
    2,500 metres (8,200 ft) below sea level. It is operated by Equinor. The field
    is named after the eight-legged steed Sleipnir of Odin, a widely revered god in
    Norse mythology.
  image_skipped: https://upload.wikimedia.org/wikipedia/commons/5/5e/Sleipner_oil_field.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled
porthos:
  wiki_title: Carbon Connect Delta Program
  wiki_url: https://en.wikipedia.org/wiki/Carbon_Connect_Delta_Program
  extract: The Carbon Connect Delta Program is a proposed carbon sequestration program
    to aid Belgium and the Netherlands in achieving carbon neutrality by 2030. It
    aims to capture, transport, and store 6.5 million tones of CO2 by 2030 using carbon
    capture and storage (CCS) in the transboundary area of the North Sea Port area
    of the Scheldt-Delta region connecting Belgium and the Netherlands.
uthmaniyah:
  wiki_title: Osman I
  wiki_url: https://en.wikipedia.org/wiki/Osman_I
  extract: Osman I or Osman Ghazi was the eponymous founder of the Ottoman Empire.
    While initially a small Turkoman principality during Osman's lifetime, his beylik
    transformed into a vast empire in the centuries after his death. It existed until
    1922, shortly after the end of World War I, when the sultanate was abolished.
  image_skipped: https://upload.wikimedia.org/wikipedia/commons/4/4a/I_Osman.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled
gorgon:
  wiki_title: Gorgon gas project
  wiki_url: https://en.wikipedia.org/wiki/Gorgon_gas_project
  extract: The Gorgon gas project is a multi-decade natural gas project in Western
    Australia, involving the development of the Greater Gorgon gas fields, subsea
    gas-gathering infrastructure, and a liquefied natural gas (LNG) plant on Barrow
    Island. The project also includes a domestic gas component. Construction was completed
    in 2017. It is Australia's most expensive ever resources development.
  image_skipped: https://upload.wikimedia.org/wikipedia/commons/4/4d/Gorgon_Barrow_Island.png?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled
moomba:
  wiki_title: Moomba, South Australia
  wiki_url: https://en.wikipedia.org/wiki/Moomba%2C_South_Australia
  extract: Moomba is a restricted access company town located in the Australian state
    of South Australia within the gazetted locality of Gidgealpa about 770 kilometres
    (480 mi) north of the state capital of Adelaide. It is operated by Santos Limited
    for the purpose of exploration and processing of natural gas found in and recovered
    from the Cooper and Eromanga Basins.
carbonnet:
  wiki_title: Net-zero emissions
  wiki_url: https://en.wikipedia.org/wiki/Net-zero_emissions
  extract: Global net-zero emissions are reached when greenhouse gas emissions and
    removals due to human activities are in balance. Net-zero emissions is often shortened
    to net zero. Once global net zero is achieved, further global warming is expected
    to significantly slow down, but the effects of existing atmospheric greenhouse
    gases will still contribute to continued warming.
  image_skipped: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Global_CO2_Pathways_Using_Remaining_Carbon_Budgets.svg/960px-Global_CO2_Pathways_Using_Remaining_Carbon_Budgets.svg.png?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail
