forge:
  wiki_title: Frontier Observatory for Research in Geothermal Energy
  wiki_url: https://en.wikipedia.org/wiki/Frontier_Observatory_for_Research_in_Geothermal_Energy
  extract: The Frontier Observatory for Research in Geothermal Energy (FORGE) is a
    US government program supporting research into geothermal energy. The FORGE site
    is near Milford, Utah, funded for up to $140 million. As of 2023, numerous test
    wells had been drilled, and flux measurements had been conducted, but energy production
    had not commenced.
weyburn:
  wiki_title: Weyburn-Midale Carbon Dioxide Project
  wiki_url: https://en.wikipedia.org/wiki/Weyburn-Midale_Carbon_Dioxide_Project
  extract: The Weyburn-Midale Carbon Dioxide Project was a large carbon capture and
    storage project. It has however been overtaken in terms of carbon capture capacity
    by projects such as the Shute Creek project and the Century Plant. It is located
    in Midale, Saskatchewan, Canada.
sleipner:
  wiki_title: Sleipner gas field
  wiki_url: https://en.wikipedia.org/wiki/Sleipner_gas_field
  extract: The Sleipner gas field is a natural gas field in the block 15/9 of the
    North Sea, about 250 kilometres (160 mi) west of Stavanger, Norway. Two parts
    of the field are in production, Sleipner West, and Sleipner East (1981). The field
    produces natural gas and light oil condensates from sandstone structures about
    2,500 metres (8,200 ft) below sea level. It is operated by Equinor. The field
    is named after the eight-legged steed Sleipnir of Odin, a widely revered god in
    Norse mythology.
qatar:
  wiki_title: Ras Laffan Industrial City
  wiki_url: https://en.wikipedia.org/wiki/Ras_Laffan_Industrial_City
  extract: Ras Laffan Industrial City is a Qatari industrial hub located 80 kilometres
    (50 mi) north of Doha. It is administered by QatarEnergy.
gorgon:
  wiki_title: Gorgon gas project
  wiki_url: https://en.wikipedia.org/wiki/Gorgon_gas_project
  extract: The Gorgon gas project is a multi-decade natural gas project in Western
    Australia, involving the development of the Greater Gorgon gas fields, subsea
    gas-gathering infrastructure, and a liquefied natural gas (LNG) plant on Barrow
    Island. The project also includes a domestic gas component. Construction was completed
    in 2017. It is Australia's most expensive ever resources development.
moomba:
  wiki_title: Moomba, South Australia
  wiki_url: https://en.wikipedia.org/wiki/Moomba%2C_South_Australia
  extract: Moomba is a restricted access company town located in the Australian state
    of South Australia within the gazetted locality of Gidgealpa about 770 kilometres
    (480 mi) north of the state capital of Adelaide. It is operated by Santos Limited
    for the purpose of exploration and processing of natural gas found in and recovered
    from the Cooper and Eromanga Basins.
gangneung:
  wiki_title: 2023년 강릉 산불
  wiki_url: https://ko.wikipedia.org/wiki/2023%EB%85%84_%EA%B0%95%EB%A6%89_%EC%82%B0%EB%B6%88
  extract: '2023년 강릉 산불은 2023년 4월 11일 오전 8시 30분 강원도 강릉시 난곡동에서 수목이 전도되면서 전신주를 덮쳐 화재가
    발생한 사고이다.

    오전 9시 43분 대응 3단계로 격상했다.'
