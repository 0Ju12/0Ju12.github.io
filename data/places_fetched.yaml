gunwi:
  wiki_title: 2025년 대구 북구 산불
  wiki_url: https://ko.wikipedia.org/wiki/2025%EB%85%84_%EB%8C%80%EA%B5%AC_%EB%B6%81%EA%B5%AC_%EC%82%B0%EB%B6%88
  extract: 2025년 대구 북구 산불은 2025년 4월 28일 오후 2시 1분 대한민국 대구광역시 북구 노곡동 함지산에서 발생한 산불이다.
miryang:
  wiki_title: 문재인 정부
  wiki_url: https://ko.wikipedia.org/wiki/%EB%AC%B8%EC%9E%AC%EC%9D%B8_%EC%A0%95%EB%B6%80
  extract: 문재인 정부(文在寅政府, 2017년~2022년)는 대한민국 제6공화국의 일곱 번째 대한민국 정부이다. 임기는 2017년 5월 10일부터
    2022년 5월 9일까지였다. 박근혜 대통령 탄핵 인용 후, 2017년 5월 9일에 치러진 대한민국 제19대 대통령 선거에서 문재인이 제19대
    대통령으로 당선되면서 이전 정부들과 달리 대한민국 대통령직인수위원회 설치 없이 선거 결과 확정 직후인 5월 10일에 출범했다. 문재인 정부는
    2022년 5월 9일 자정에 맞춰 임기가 만료되었다.
  image_skipped: https://upload.wikimedia.org/wikipedia/commons/0/0d/President_Moon_Jae_In.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled
gangneung:
