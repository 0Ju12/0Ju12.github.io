  - id: wildfire-capstone
    title: 시공간 딥러닝 기반 산불 확산 경로 예측 모델
    type: 프로젝트
    org: 전북대학교 IAB 융합전공 · 창의적공학설계 (캡스톤)
    period: { start: "2023.09", end: "2023.12" }
    team: "4인"
    role: 팀원        # TODO 담당 역할 확인 (체크리스트 9번)
    featured: true
    tags: [딥러닝, U-LSTM, GIS, 시공간 예측, Python]
    summary: 기상·지형·식생 데이터로 다음 시점의 산불 화선을 예측하는 U-LSTM 모델 구축
    star:
      situation: 산불은 풍향·풍속·임상 등에 따라 급속히 확산되지만, 국내에는 실시간 산불 확산 경로 예측 모델이 없었음
      task: 산불 상황도와 기상·지리 데이터로 다음 시점의 산불 확산을 예측하는 딥러닝 모델 구축
      action:
        - 울진·삼척, 군위, 밀양, 강릉 등 4개 대형 산불의 확산 양상을 GIS로 2D 래스터 데이터화 (3개 학습, 1개 테스트)
        - 화선·고도·NDVI(식생지수)·풍향·풍속 5개 변수를 래스터로 구축하고, 부족한 데이터는 time step별 시퀀스를 추가 생성해 보완
        - Conv2D(공간) + LSTM(시계열) + Conv2D Transpose 구조의 U-LSTM 모델을 얕게 설계해 소규모 데이터에 맞춤
      result:
        - 검증 정확도 0.95, F1-score 0.81
        - 미학습 산불 테스트 정확도 0.90, F1-score 0.85
    links: []

