            - "API 관제(API Watch): 공개 API 22개를 정기 점검 — HTTP 200이어도 오래된 자료·빈 결과·중복·자료형 변경을 따로 판정하고, 첫 정상 응답의 구조를 저장해 필드 추가와 삭제·형 변경을 구분, 연속 실패만 이슈 한 건으로 모음 (Django 관리 화면·Docker Compose 실행판 포함)"
