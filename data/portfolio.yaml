activities:
  - id: wildfire-capstone
    title: 시공간 딥러닝 기반 산불 확산 경로 예측 모델
    type: AI 프로젝트
    org: 전북대학교 IAB 융합전공 · 창의적공학설계 (캡스톤)
    period: { start: "2023.09", end: "2023.12" }
    team: "4인 팀"
    role: 모델 설계·학습 담당
    featured: true
    priority: 1
    tags: [Python, TensorFlow, PyTorch, U-LSTM, ArcGIS]
    image: assets/wildfire_test_map.png
    image_caption: "미학습 산불(테스트) — 위: 실제 확산, 아래: 모델 예측 (t1→t5)"
    summary: 이전 시점의 화선·기상·지형 데이터로 다음 시점의 산불 화선을 예측하는 U-LSTM 모델
    star:
      situation: 산불은 풍향·풍속·식생에 따라 빠르게 번지지만, 국내에는 실시간 산불 확산 경로를 예측하는 모델이 없었음
      task: 팀에서 시공간 딥러닝 모델의 설계와 학습을 맡아, 다음 시점의 산불 확산 범위를 예측하는 것이 목표
      action:
        - Conv2D 인코더 → LSTM → Conv2DTranspose 디코더 구조의 U-LSTM 모델을 설계하고, 데이터가 적은 점을 고려해 파라미터 2,736개의 얕은 네트워크로 구성
        - 부족한 시점 데이터를 길이 1~19의 슬라이딩 윈도우로 확장해 학습 배치 151개 구성
        - TensorFlow·PyTorch로 모델을 구현하고 Overall Accuracy·F1-score로 검증·평가
        - "입력 데이터: 4개 대형 산불(울진·삼척, 군위, 밀양, 강릉)의 화선·고도·NDVI·풍향·풍속을 ArcGIS로 2D 래스터화 — 3개로 학습, 1개는 미학습 테스트로 일반화 성능 검증"
      result:
        - 검증 정확도 0.95, F1-score 0.81
        - 학습에 쓰지 않은 산불 테스트에서 정확도 0.90, F1-score 0.85
        - 초기 시점은 데이터 한계로 오차가 있지만, 후반으로 갈수록 실제 확산 형태를 근접하게 재현
        - 팀 노트북을 설정 파일 기반 Python 패키지로 재구성하고 테스트를 추가해 GitHub에 공개
    links:
      - { label: GitHub 코드, url: "https://github.com/0Ju12/wildfire-spread-prediction" }

  - id: posco-pospeak
    title: 콩글리시 → 원어민 표현 교정 시스템 (FLAN-T5 + RAG)
    type: AI 프로젝트
    org: 포스코 청년 AI·Big Data 아카데미 30기 · 팀 프로젝트
    period: { start: "2025.08", end: "" }
    team: "팀 프로젝트 · 장려상"
    role: 데이터 구축·모델 실험 담당
    featured: true
    priority: 2
    tags: [Python, Hugging Face, FLAN-T5, LoRA, RAG, FAISS]
    summary: 어색한 영어·콩글리시 문장을 자연스러운 원어민 표현으로 바꿔 주는 생성 모델 + 검색 증강(RAG) 시스템
    star:
      situation: 한국 학습자가 쓰는 콩글리시와 어색한 격식체 영어는 문법 교정기로 잡히지 않아, 문맥에 맞는 자연스러운 표현으로 바꿔 주는 도구가 필요했음
      task: 팀에서 교정 학습 데이터 구축과 모델 실험을 맡아, 단어 단위·문맥 단위 교정 데이터로 T5 계열 모델의 학습 전략을 찾는 것이 목표
      action:
        - "[담당] 콩글리시·어색한 표현 → 원어민 표현 쌍으로 이루어진 단어 단위·문맥 단위 교정 데이터셋 구축 및 정제"
        - "[담당] FLAN-T5를 LoRA로 파인튜닝하고, 학습 전략 3가지(단어→문맥 순차, 문맥→단어 순차, 통합 학습)를 BERTScore로 비교 실험"
        - "[팀] 다국어 문장 임베딩(paraphrase-multilingual-MiniLM)과 FAISS로 유사 교정 예문 top-5를 검색해 모델 입력에 제공하는 RAG 파이프라인과 CLI 구성"
      result:
        - 순차 학습에서 앞 단계 성능이 떨어지는 catastrophic forgetting(BERTScore F1 0.47 → 0.32)을 실험으로 확인하고 통합 학습으로 전환
        - 통합 학습 모델의 검증 BERTScore F1 약 0.74 (순차 학습 0.32~0.47 대비 개선)
        - 팀 프로젝트 장려상 수상
    links:
      - { label: 팀 GitHub, url: "https://github.com/POSCO-AI-BigData-30th/ai-pospeak/tree/db2-t5" }

  - id: masters
    title: 중력·자력 데이터 파수 상관 분석으로 지하 구조 규명 (석사 · SPE Journal 제1저자)
    type: 연구
    org: 지구물리컴퓨팅연구실 · 환경에너지융합학과
    period: { start: "2024.03", end: "2026.08" }
    role: 석사과정 연구원
    featured: true
    priority: 3
    tags: [신호처리(파수 영역), 상관 분석, 지표 설계, 중력·자력 데이터, CCS]
    summary: 겹쳐 있는 중력·자력 신호를 파수 영역 상관 분석으로 분리하는 지표(SLFI·DLFI)를 설계해 암염·기반암 구조를 규명
    star:
      situation: 아부다비 해상 가샤 지역은 암염과 기반암이 8~10 km 두께의 퇴적층 아래에 겹쳐 있어, 중력·자력 신호가 섞이고 기존 해석법은 암염 깊이를 약 6,000 m로 실제(탄성파 기준 약 9,300 m)보다 크게 얕게 추정하는 한계가 있었음
      task: 항공 중력·자력 데이터에서 기반암과 암염의 신호를 분리해 각 구조를 규명하는 분석 방법을 제안
      action:
        - 상향 연속·정규화로 중력·자력 데이터를 전처리하고, 파수(wavenumber) 영역에서 두 신호의 상관계수 CC(k)를 계산하는 파수 상관 필터링(WCF) 파이프라인 구축
        - 양의 상관 성분을 강조해 기반암을 드러내는 SLFI, 약한·음의 상관 성분으로 암염을 드러내는 DLFI 두 지표를 설계
        - 기존 3개 독립 모델과 공간 비교·측선별 비교·3D 밀도 모델로 결과를 다각도 검증
        - "관련 연구: GPlates로 해외 대규모 CO2 저장소 형성사를 복원하고 탄성파 영상을 해석(제1저자, 2024), 슬라이프너 탄성파-전자탐사 복합 해석, 스메아하이아 부지 적합성 분석"
      result:
        - SLFI 기반 기반암 구조가 서로 다른 해석법의 기존 독립 모델 3개와 상관계수 0.94 이상으로 일치
        - DLFI로 암염 구조의 공간 분포를 재현하고, 가샤 서쪽의 추가 암염 융기 가능성을 새로 제시
        - SCIE 국제학술지 SPE Journal 제1저자 논문 (2026, 캘거리대·칼리파대 공동연구) · 국내 제1저자 논문 1편 · 학회 발표 5건
        - 2024 KSEG 추계학술대회 학생 우수논문(포스터) 발표상 · 2026년 석사 학위 취득
    links:
      - { label: SPE Journal 논문, url: "https://doi.org/10.2118/236968-PA" }
      - { label: 국내 제1저자 논문, url: "https://koreascience.or.kr/article/JAKO202410348585789.page" }
      - { label: 연구 이력, url: "https://www.geoverselab.com/ko/research-history/13/" }

