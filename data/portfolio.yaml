activities:
  - id: wildfire-capstone
    title: 시공간 딥러닝 기반 산불 확산 경로 예측 모델
    type: AI 프로젝트
    org: 전북대학교 IAB 융합전공 · 창의적공학설계 (캡스톤)
    period: { start: "2023.09", end: "2023.12" }
    team: "4인 팀"
    role: 모델 설계·학습 담당
    featured: true
    priority: 1
    tags: [Python, TensorFlow, PyTorch, U-LSTM, ArcGIS]
    image: assets/wildfire_test_map.png
    image_caption: "미학습 산불(테스트) — 위: 실제 확산, 아래: 모델 예측 (t1→t5)"
    summary: 이전 시점의 화선·기상·지형 데이터로 다음 시점의 산불 화선을 예측하는 U-LSTM 모델
    star:
      situation: 산불은 풍향·풍속·식생에 따라 빠르게 번지지만, 국내에는 실시간 산불 확산 경로를 예측하는 모델이 없었음
      task: 팀에서 시공간 딥러닝 모델의 설계와 학습을 맡아, 다음 시점의 산불 확산 범위를 예측하는 것이 목표
      action:
        - Conv2D(공간 특징) → LSTM(시계열 특징) → Conv2D Transpose(지도 복원) 구조의 U-LSTM 모델을 설계하고, 데이터가 적고 시계열이 짧은 점을 고려해 네트워크를 얕게 구성
        - 학습 데이터 부족을 time step별 시퀀스 추가 생성으로 보완
        - TensorFlow·PyTorch로 모델을 구현하고 Overall Accuracy·F1-score로 검증·평가
        - "입력 데이터: 4개 대형 산불(울진·삼척, 군위, 밀양, 강릉)의 화선·고도·NDVI·풍향·풍속을 ArcGIS로 2D 래스터화 — 3개로 학습, 1개는 미학습 테스트로 일반화 성능 검증"
      result:
        - 검증 정확도 0.95, F1-score 0.81
        - 학습에 쓰지 않은 산불 테스트에서 정확도 0.90, F1-score 0.85
        - 초기 시점은 데이터 한계로 오차가 있지만, 후반으로 갈수록 실제 확산 형태를 근접하게 재현
    links: []

