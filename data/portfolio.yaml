  name: 이영주
  name_en: Young-Ju Lee
  title: 데이터·AI 엔지니어
  headline: "복잡한 지구과학 데이터를 딥러닝과 분석으로 풀어내는 데이터·AI 엔지니어"
  summary: >-
    자원에너지공학을 전공하고 환경에너지융합학과에서 석사 학위를 받았습니다(2026).
    학부연구생으로 판구조 형성사를 고려한 해외 대규모 CO2 저장소 탄성파 해석 논문을 제1저자로 썼고,
    IAB 융합전공 캡스톤에서는 시공간 딥러닝(U-LSTM) 기반 산불 확산 경로 예측 모델의 설계와 학습을 맡았습니다.
    석사 과정에서는 중력·자력 데이터의 파수 상관 분석으로 지하 구조를 규명해 SCIE 국제학술지 SPE Journal 제1저자 논문을 냈고,
    학부·석사를 합쳐 논문 3편과 학회 발표 6건, 학회 우수논문 발표상의 성과를 냈습니다.
    포스코 청년 AI·BigData 아카데미(POSTECH)에서는 FLAN-T5와 RAG를 결합한 영어 표현 교정 시스템 프로젝트에서 데이터 구축과 모델 실험을 맡았고, 팀은 장려상을 받았습니다.
    SSAFY 16기에서는 LLM 판단을 코드로 검증하는 데이터 파이프라인과 Django·FastAPI 서비스를 만들며 자동 테스트 142개로 동작을 확인했고, 개인 프로젝트로 근거 번호를 코드로 검증하는 RAG 가이드를 구현했습니다.
    캐나다 캘거리대학교에서 두 차례 파견 연구를 하며 해외 연구진과 협업했고, ADsP(데이터분석 준전문가) 자격을 보유하고 있습니다.
