<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><rect width="1440" height="760" fill="#f4f7fb"/><text x="70" y="100" font-family="sans-serif" font-size="38" font-weight="700" fill="#132940">판단과 실행을 분리한 검증 흐름</text><text x="70" y="148" font-family="sans-serif" font-size="22" fill="#607083">포트폴리오·회고 원문에 근거해 재구성한 개념도 · 실제 측정 그래프 아님</text><rect x="70" y="280" width="235" height="210" rx="18" fill="#132940"/><text x="95" y="335" font-family="sans-serif" font-size="24" fill="#c48c3b">01</text><text x="95" y="390" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">댓글</text><text x="95" y="426" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">수집</text><path d="M312 385h20m-8-8 8 8-8 8" fill="none" stroke="#c48c3b" stroke-width="4"/><rect x="340" y="280" width="235" height="210" rx="18" fill="#e4ebf3"/><text x="365" y="335" font-family="sans-serif" font-size="24" fill="#c48c3b">02</text><text x="365" y="390" font-family="sans-serif" font-size="24" font-weight="700" fill="#132940">LLM:</text><text x="365" y="426" font-family="sans-serif" font-size="24" font-weight="700" fill="#132940">번호 판단</text><path d="M582 385h20m-8-8 8 8-8 8" fill="none" stroke="#c48c3b" stroke-width="4"/><rect x="610" y="280" width="235" height="210" rx="18" fill="#132940"/><text x="635" y="335" font-family="sans-serif" font-size="24" fill="#c48c3b">03</text><text x="635" y="390" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">코드:</text><text x="635" y="426" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">원본 대조</text><path d="M852 385h20m-8-8 8 8-8 8" fill="none" stroke="#c48c3b" stroke-width="4"/><rect x="880" y="280" width="235" height="210" rx="18" fill="#e4ebf3"/><text x="905" y="335" font-family="sans-serif" font-size="24" fill="#c48c3b">04</text><text x="905" y="390" font-family="sans-serif" font-size="24" font-weight="700" fill="#132940">정제·증강·요약</text><text x="905" y="426" font-family="sans-serif" font-size="24" font-weight="700" fill="#132940"></text><path d="M1122 385h20m-8-8 8 8-8 8" fill="none" stroke="#c48c3b" stroke-width="4"/><rect x="1150" y="280" width="235" height="210" rx="18" fill="#132940"/><text x="1175" y="335" font-family="sans-serif" font-size="24" fill="#c48c3b">05</text><text x="1175" y="390" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">규칙·예외</text><text x="1175" y="426" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">테스트</text><text x="70" y="650" font-family="sans-serif" font-size="22" fill="#607083">입력의 조건 → 처리의 책임 → 평가의 범위를 구분해 설명합니다.</text></svg>