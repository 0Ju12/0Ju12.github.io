<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark">
<title>네오 · 개인 비서 업무실</title>
<style>
:root {
  color-scheme: light;
  --paper: #f6f7f2; --surface: #fff; --ink: #17332e; --muted: #50635c;
  --teal: #145b50; --hover: #104a41; --line: #cdd7cf; --tint: #e7eee7;
}
@media (prefers-color-scheme: dark) {
  :root {color-scheme:dark; --paper:#10201d; --surface:#172b26; --ink:#edf5eb; --muted:#b8c9bf;
    --teal:#afe4ce; --hover:#c4f5df; --line:#3d534a; --tint:#20392f}
}
* {box-sizing:border-box}
body {margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Segoe UI","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
a {color:inherit;text-decoration:none}
button,input {font:inherit}
button,summary {cursor:pointer}
:focus-visible {outline:3px solid #268377;outline-offset:4px}
.shell {width:min(1100px,100% - 64px);margin:0 auto}
.top {display:flex;align-items:center;justify-content:space-between;gap:15px;padding:24px 0;border-bottom:1px solid var(--line)}
.brand {display:inline-flex;align-items:center;gap:12px;font-size:15px;font-weight:650}
.brandmark {font:italic 700 31px/1 Georgia,serif;letter-spacing:-.09em;color:var(--teal);padding-right:12px;border-right:1px solid var(--line)}
.back {color:var(--muted);font-size:14px}.back:hover,.text-link:hover {text-decoration:underline}
.welcome {display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);align-items:stretch;gap:clamp(20px,4.4vw,68px);padding:clamp(32px,5vw,72px) 0}
.intro {align-self:center;padding:8px 0}
.dateline {display:flex;align-items:center;gap:10px;min-height:20px;color:var(--teal);font-size:13px;font-weight:650;letter-spacing:.03em}
.dateline::before {content:"";width:28px;border-top:2px solid currentColor}
h1 {font-size:clamp(34px,4.3vw,64px);line-height:1.17;letter-spacing:-.068em;margin:20px 0 17px;font-weight:740}
h1 span {display:block}
.intro p {max-width:38ch;color:var(--muted);font-size:clamp(15px,1.25vw,18px);margin:0;line-height:1.8}
.enter {display:inline-flex;align-items:center;justify-content:space-between;gap:32px;border:0;margin-top:27px;background:var(--teal);color:var(--surface);padding:12px 20px;border-radius:10px;font-weight:700}
.enter:hover,.save:hover {background:var(--hover)}
.enter span:last-child {font-size:21px;line-height:1}
.signin {display:block;margin-top:10px;color:var(--muted);font-size:13px}
.memory {position:relative;margin:0;isolation:isolate;min-height:340px;overflow:hidden;border-radius:4px 36px 4px 4px;background:#233c37}
.memory img {position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 52%}
.memory::after {position:absolute;inset:42% 0 0;content:"";background:linear-gradient(transparent,rgba(7,22,17,.8));pointer-events:none}
.memory figcaption {position:absolute;inset:auto 23px 19px;z-index:1;display:flex;align-items:end;justify-content:space-between;gap:12px;color:white}
.memory figcaption strong {display:block;font-weight:600;font-size:18px}.memory figcaption small {font-size:12px;color:#f0f3ea}
.memory time {font:14px/1.5 ui-monospace,monospace;letter-spacing:.03em}
.connection {border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:36px}
.status-row {display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 24px}
.status-text {min-width:0}
.status-text h2 {display:flex;align-items:center;gap:9px;margin:0;font-size:16px;letter-spacing:-.03em}
.status-text h2::before {content:"";width:8px;height:8px;border-radius:50%;background:#b0792d}
body[data-ready=yes] .status-text h2::before {background:#399169}
#state {color:var(--muted);margin:4px 0 0 17px;font-size:14px}
.resume {display:inline-flex;align-items:center;justify-content:center;gap:12px;flex:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;color:var(--teal);font-size:14px;font-weight:650}
.resume:hover {background:var(--tint)}
details {border-top:1px solid var(--line)}
summary {display:flex;align-items:center;justify-content:space-between;padding:12px 24px;color:var(--muted);font-size:14px;list-style:none}
summary::-webkit-details-marker {display:none}
summary::after {content:"＋";font-size:18px}details[open] summary::after {content:"−"}
form {padding:3px 24px 23px;max-width:750px}
form label {display:block;margin-bottom:5px;font-weight:600;font-size:14px}
.field {display:flex;gap:8px}
input {width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;padding:8px 11px;color:var(--ink);background:var(--paper)}
.save {border:0;border-radius:7px;background:var(--teal);color:var(--surface);padding:8px 16px;white-space:nowrap;font-weight:650}
#note {display:block;color:var(--muted);margin:6px 0;font-size:13px}#note.error {color:#ad4c30}
.text-link {font-size:14px;color:var(--teal)}
@media(max-width:680px){
  .shell {width:calc(100% - 36px)}.top {padding:16px 0}.brand {gap:8px;font-size:13px}.brandmark {font-size:26px}.back {font-size:13px}
  .welcome {grid-template-columns:1fr;gap:22px;padding:27px 0 20px}.intro {padding:0}
  h1 {margin:12px 0;font-size:clamp(34px,8vw,48px)}.intro p {max-width:38ch}
  .enter {margin-top:16px}.memory {min-height:148px;height:clamp(148px,29vw,190px);border-top-right-radius:24px}
  .memory img {object-position:center 44%}.memory figcaption {inset:auto 15px 12px}.memory figcaption strong {font-size:15px}
  .status-row {padding:15px;align-items:start;flex-wrap:wrap;gap:12px}.resume {margin-left:17px}summary {padding:10px 15px}form {padding:0 15px 16px}
}
</style><style data-wrapfix>:where(html:lang(ko)) :where(body){word-break:keep-all;overflow-wrap:anywhere}:where(body){text-wrap-style:pretty}:where(h1,h2,h3,h4,h5,h6,figcaption,summary,dt,th,caption){text-wrap-style:balance}:where(pre,code,kbd,samp,textarea,input){word-break:normal;text-wrap-style:auto}:where(td,th){overflow-wrap:break-word}</style></head>
<body data-ready="no"><main class="shell">
  <nav class="top" aria-label="포트폴리오 탐색">
    <div class="brand"><span class="brandmark" lang="en">Neo</span><span>개인 비서 업무실</span></div>
    <a class="back" href="../">← 포트폴리오</a>
  </nav>
  <section class="welcome" aria-labelledby="hello">
    <div class="intro">
      <div class="dateline"><time id="today">오늘의 업무실</time></div>
      <h1 id="hello"><span>영주 님,</span><span>무엇부터 해볼까요?</span></h1>
      <p>개인 비서 네오예요. 오늘 챙길 일부터 살펴보고, 지난번에 남긴 업무도 함께 이어가요.</p>
      <a class="enter" id="open"><span>내 업무실 열기</span><span aria-hidden="true">→</span></a>
      <small class="signin">영주 님의 GitHub 계정으로 입장합니다.</small>
    </div>
    <figure class="memory">
      <img src="../assets/photos/calgary-2024/2024-08_카나나스키스_(캐나다_로키).jpg" alt="캐나다 로키의 산길에서 바라본 카나나스키스 계곡" width="636" height="960">
      <figcaption><div><small>내 포트폴리오 사진</small><strong>캐나다, 카나나스키스</strong></div><time datetime="2024-08">2024.08</time></figcaption>
    </figure>
  </section>
  <section class="connection" aria-labelledby="connection-heading">
    <div class="status-row">
      <div class="status-text"><h2 id="connection-heading">업무실 연결</h2><p id="state" role="status">네오가 업무실 연결을 확인하고 있어요.</p></div>
      <a class="resume" id="resume" target="_blank" rel="noopener">Codespace 재개 <span aria-hidden="true">↗</span></a>
    </div>
    <details id="settings"><summary>실행 환경 주소 설정</summary>
      <form id="address-form"><label for="address">Codespace 편집기 주소 또는 8501 포트 주소</label>
        <div class="field"><input id="address" type="url" required autocomplete="off" spellcheck="false" placeholder="https://…github.dev"><button class="btn save">저장</button></div>
        <small id="note" role="status">Codespace를 바꿨다면 새 주소를 입력하세요. 이 브라우저에 저장됩니다.</small>
        <a class="text-link" href="https://github.com/codespaces" target="_blank" rel="noopener">내 Codespaces 목록 열기 ↗</a>
      </form>
    </details>
  </section>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s);
const now=new Date();
const seoulDate=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',dateStyle:'full'});
$('#today').textContent=seoulDate.format(now);
$('#today').dateTime=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(now);
const KEY='personal-assistant.port8501', DEFAULT='https://humble-tribble-x544gwrrjgrg2vq75.github.dev/';
const PROBE_MS=4000, WATCH_MS=120000;
function workspace(value){
  try{
    const u=new URL(String(value||'').trim());
    const m=/^([a-z0-9]+(?:-[a-z0-9]+)*?)(?:-8501\.app)?\.github\.dev$/.exec(u.hostname);
    if(u.protocol==='https:'&&!u.port&&!u.username&&!u.password&&m)
      return {app:'https://'+m[1]+'-8501.app.github.dev/',editor:'https://'+m[1]+'.github.dev/'};
  }catch{}
  return null;
}
let saved=null;try{saved=workspace(localStorage.getItem(KEY))}catch{}
let ws=saved||workspace(DEFAULT), generation=0;
function apply(){$('#open').href=ws.app;$('#resume').href=ws.editor;$('#address').value=ws.app}
function probe(url){
  // The private port answers a 1×1 image only to the signed-in owner.
  return new Promise(resolve=>{
    const img=new Image(),done=ok=>{clearTimeout(timer);img.onload=img.onerror=null;resolve(ok)};
    const timer=setTimeout(()=>done(false),PROBE_MS);
    img.onload=()=>done(img.naturalWidth===1&&img.naturalHeight===1);img.onerror=()=>done(false);
    img.src=url+'ready.svg?'+Date.now();
  });
}
async function watch(){
  const id=++generation, until=Date.now()+WATCH_MS;
  while(id===generation){
    if(await probe(ws.app)){
      if(id!==generation)return;
      document.body.dataset.ready='yes';$('#state').textContent='연결됐어요. 업무실로 이동할게요.';
      location.assign(ws.app);return;
    }
    if(id!==generation)return;
    if(Date.now()>until){$('#state').textContent='자동 확인을 마쳤어요. Codespace를 재개한 뒤 ‘내 업무실 열기’를 눌러 주세요.';return}
    $('#state').textContent='연결 대기 중이에요. 2분 안에 연결되면 자동으로 입장해요. Codespace가 중지됐다면 재개해 주세요.';
    await new Promise(r=>setTimeout(r,PROBE_MS));
  }
}
$('#address-form').onsubmit=e=>{
  e.preventDefault();const next=workspace($('#address').value),note=$('#note');
  if(!next){note.textContent='GitHub Codespace 편집기 주소(…github.dev) 또는 8501 포트 주소를 입력해 주세요.';note.classList.add('error');return}
  try{localStorage.setItem(KEY,next.app)}catch{}
  ws=next;apply();note.classList.remove('error');note.textContent='저장했습니다. 새 주소로 다시 확인합니다.';watch();
};
const hint=new URLSearchParams(location.hash.slice(1)).get('connect');
apply();
if(hint&&workspace(hint)){$('#settings').open=true;$('#address').value=workspace(hint).app;$('#state').textContent='새 실행 환경 주소가 전달됐습니다. 확인 후 저장해 주세요.'}
else watch();
</script><script id="wrapfix-js">(function(){var R=[[/ \u00b7 /g,'\u00a0\u00b7 '],[/ \u2014 /g,'\u00a0\u2014 '],[/ \u2192 /g,'\u00a0\u2192 '],[/ \u2013 /g,'\u00a0\u2013\u00a0'],[/([^\s\u00a0\u2060])\u00b7(?=[^\s\u00a0\u200b])/g,'$1\u2060\u00b7\u200b']];
